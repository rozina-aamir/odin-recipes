        <h1>Pasta</h1>

<!--
Description
This recipe will show you how to create cheesy garlic pasta
 -->

<!--
Ingredients
200g pasta
2 cloves minced garlic
2 tablespoons butter
Quarter cup grated cheese
Salt and pepper 
-->

<!-- 
Steps
Cook the pasta is large pot of salted boiling water
In a large pan, melt butter over medium heat
Add the minced garlic
Add the cooked pasta to the pan
Toss the pasta to coat with garlic butter
Stir the cheese, salt, and pepper
Serve immediately
 -->
