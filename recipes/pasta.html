        <h1>Description</h1>
        <p>This recipe will show you how to create cheesy garlic pasta.</p>
        <br>
        <h2>Ingredients</h2>
        <ul>
            <li>200g pasta</li>
            <li>2 cloves minced garlic</li>
            <li>2 tablespoons butter</li>
            <li>Quarter cup grated cheese</li>
            <li>Salt and pepper</li>
        </ul>

Serve immediately
